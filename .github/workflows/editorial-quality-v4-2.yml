name: Editorial quality review v4.2
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without writing to Notion
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: read
concurrency:
  group: blog-draft-v3
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_CONTENT_DS: 'b2ace958-aa15-4105-973b-5fb1af090ec3'
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Quality evaluation without publication
        run: python -m src.quality_review
