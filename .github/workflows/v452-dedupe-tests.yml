name: v4.5.2 dedupe tests
on:
  pull_request:
    paths:
      - 'src/daily.py'
      - 'src/topic_dedupe.py'
      - 'tests/test_topic_dedupe.py'
      - '.github/workflows/v452-dedupe-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests without external API calls
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src
