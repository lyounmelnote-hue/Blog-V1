name: v4.5 scoring tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/editorial_v45.py'
      - 'tests/test_editorial_v45.py'
      - '.github/workflows/v45-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
