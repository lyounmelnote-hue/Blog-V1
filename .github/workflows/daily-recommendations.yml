name: Daily research review queue v3.7
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        required: true
      recommend_date:
        type: string
        required: false
        default: ''

  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: read
concurrency:
  group: blog-daily-v3-7
  cancel-in-progress: false
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NOTION_DAILY_DS: '13615add-6aef-417c-b1f7-ca93217f4cea'
      NOTION_SOURCES_DS: '51596cf1-d049-472d-9689-8048f527ab41'
      NOTION_LOGS_DS: '25735bf7-9a91-4d0a-a596-d867d9c66447'
      REVIEW_QUEUE: 'true'
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      RECOMMEND_DATE: ${{ inputs.recommend_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.daily
