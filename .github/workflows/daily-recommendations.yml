name: Daily research review queue v3.8
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        required: true
      recommend_date:
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 1 * * *' # 10:07 KST primary
    - cron: '0 2 * * *' # 11:07 KST recovery
permissions:
  contents: read
concurrency:
  group: blog-daily-v3-8
  cancel-in-progress: false
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NOTION_DAILY_DS: '13615add-6aef-417c-b1f7-ca93217f4cea'
      NOTION_SOURCES_DS: '51596cf1-d049-472d-9689-8048f527ab41'
      NOTION_LOGS_DS: '25735bf7-9a91-4d0a-a596-d867d9c66447'
      REVIEW_QUEUE: 'true'
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      RECOMMEND_DATE: ${{ inputs.recommend_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Scheduled execution diagnostics
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          event = os.getenv('EVENT_NAME', '')
          cron = os.getenv('SCHEDULE_EXPR', '')
          kind = 'recovery' if cron == '0 2 * * *' else ('primary' if cron == '0 1 * * *' else 'manual')
          print(f'SCHEDULE_DIAGNOSTICS event={event} mode={kind} cron={cron or "none"}')
          print('Recovery checks existing Notion rows using src.daily DEDUP_DIAGNOSTICS and DEDUP_SKIP.')
          PY
      - run: python -m src.daily
